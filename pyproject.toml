[project]
name = "mvsep-karaoke"
version = "0.1.0"
description = "Make a karaoke track (lead vocals removed) from a song with the MVSEP API"
readme = "README.md"
authors = [
    { name = "Muhammed Minhaj VP", email = "vpmuhammedminhaj02@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2",
    "numpy>=2.0.0; sys_platform != 'android'",
    "faster-whisper>=1.2.1; sys_platform != 'android'",
    "uharfbuzz>=0.56.3",
]

[project.scripts]
karaoke = "mvsep_karaoke.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
