<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Karaoke lyrics sync</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --bg: #101014;
        --panel: #1a1a22;
        --edge: #2c2c3a;
        --text: #fff;
        --soft: #b4b4c2;
        --dim: #8a8a96;
        --gold: #ffd700;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.4 "Segoe UI",
          system-ui,
          sans-serif;
      }
      header,
      nav,
      footer {
        background: var(--panel);
        padding: 10px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
      }
      header {
        padding-bottom: 4px;
      }
      nav {
        border-bottom: 1px solid var(--edge);
      }
      footer {
        border-top: 1px solid var(--edge);
        color: var(--dim);
        font-size: 13px;
      }
      h1 {
        font-size: 17px;
        margin: 0 8px 0 0;
      }
      button,
      select {
        background: #262633;
        color: var(--text);
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--dim);
      }
      button.on {
        background: var(--gold);
        color: #111;
        border-color: var(--gold);
        font-weight: 600;
      }
      button.main {
        background: var(--gold);
        color: #111;
        border-color: var(--gold);
        font-weight: 600;
      }
      #save.unsaved::after {
        content: " \2022";
      }
      #seek {
        flex: 1 1 220px;
        accent-color: var(--gold);
      }
      #clock {
        font-variant-numeric: tabular-nums;
        min-width: 128px;
      }
      .steps {
        display: flex;
      }
      .steps button {
        border-radius: 0;
        margin-left: -1px;
      }
      .steps button:first-child {
        border-radius: 6px 0 0 6px;
        margin-left: 0;
      }
      .steps button:last-child {
        border-radius: 0 6px 6px 0;
      }
      .steps small {
        opacity: 0.7;
        margin-left: 4px;
        font-variant-numeric: tabular-nums;
      }
      #hint {
        flex: 1 1 320px;
        color: var(--dim);
      }
      body:not([data-step="line"]) #clear {
        display: none;
      }
      #keys {
        display: contents;
      }
      #status {
        margin-left: auto;
        color: var(--gold);
      }
      kbd {
        background: #262633;
        border: 1px solid var(--edge);
        border-radius: 4px;
        padding: 1px 6px;
        color: var(--text);
        font: inherit;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 30vh 16px;
        scroll-behavior: smooth;
        user-select: none;
      }
      .line {
        display: flex;
        gap: 16px;
        align-items: baseline;
        justify-content: center;
        padding: 7px 12px;
        margin: 2px auto;
        max-width: 1100px;
        border-radius: 8px;
        cursor: pointer;
        border-left: 4px solid transparent;
      }
      .line:hover {
        background: #17171f;
      }
      .line.target {
        background: #20202b;
        border-left-color: var(--gold);
      }
      .line.untimed {
        --ink: var(--dim);
      }
      .line.guess {
        --ink: var(--soft);
      }
      .line.tapped {
        --ink: var(--text);
      }
      .stamp {
        flex: 0 0 76px;
        text-align: right;
        color: var(--dim);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .words {
        flex: 0 1 auto;
        font-size: 26px;
        font-weight: 600;
        text-align: center;
      }
      .word {
        color: var(--ink);
        border-radius: 4px;
      }
      .line.guess .word {
        text-decoration: underline dotted #5c5c70;
        text-underline-offset: 6px;
      }
      body[data-step="word"] .word:hover {
        background: #2a2a38;
      }
      .line .word.sung {
        color: var(--gold);
      }
      .line .word.active {
        background: linear-gradient(
          90deg,
          var(--gold) var(--fill, 0%),
          var(--ink) var(--fill, 0%)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .line .word.next {
        text-decoration: underline solid var(--gold);
        text-underline-offset: 6px;
      }
      #timeline {
        flex: none;
        width: 100%;
        height: 140px;
        background: #0c0c10;
        border-top: 1px solid var(--edge);
        touch-action: none;
      }
      #editor {
        display: none;
        flex: 1;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
      }
      #editor textarea {
        flex: 1;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 12px;
        font:
          16px/1.5 "Segoe UI",
          system-ui,
          sans-serif;
        resize: none;
      }
      body.editing main,
      body.editing nav,
      body.editing #timeline {
        display: none;
      }
      body.editing #editor {
        display: flex;
      }
    </style>
  </head>
  <body data-step="line">
    <header>
      <h1 id="title">Karaoke lyrics sync</h1>
      <button id="play">Play</button>
      <span id="clock">00:00.00 / 00:00.00</span>
      <input id="seek" type="range" min="0" max="1" step="0.01" value="0" />
      <select id="speed" title="Playback speed">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
      </select>
      <button id="save" class="main" title="Write the .lrc file (Ctrl+S)">
        Save
      </button>
      <button id="close">Close</button>
    </header>
    <nav>
      <span class="steps">
        <button
          id="byLine"
          title="Each tap times a whole line; its words are spread over it by length"
        >
          1 Lines <small id="lineCount"></small>
        </button>
        <button id="byWord" title="Each tap times one word">
          2 Words <small id="wordCount"></small>
        </button>
        <button id="review" title="Play the result back; taps are off">
          3 Review
        </button>
      </span>
      <span id="hint"></span>
      <button id="earlier" title="Move every timing 50 ms earlier">
        &minus;50 ms
      </button>
      <button id="later" title="Move every timing 50 ms later">+50 ms</button>
      <button
        id="clear"
        title="Remove the timing of the marked line and every line after it"
      >
        Clear from here
      </button>
      <button id="edit">Edit lyrics</button>
    </nav>
    <main id="lines"></main>
    <canvas id="timeline"></canvas>
    <section id="editor">
      <div>
        One lyric line per row. Rows you do not change keep their timing; a row
        you only reword keeps its place in the song.
      </div>
      <textarea
        id="text"
        spellcheck="false"
        placeholder="Paste or type the lyrics here, one line per row"
      ></textarea>
      <div>
        <button id="apply" class="main">Use these lyrics</button>
        <button id="cancel">Cancel</button>
      </div>
    </section>
    <footer>
      <span id="keys"></span>
      <span
        >timeline: drag an edge to move it (<kbd>Shift</kbd> parts two words),
        drag the wave to scrub, scroll to zoom</span
      >
      <span id="status"></span>
    </footer>
    <script>
      const base = location.pathname.endsWith("/")
        ? location.pathname
        : location.pathname + "/";
      const SECONDS_PER_CHAR = 0.06; // the same sung-length estimate the renderer uses
      const MIN = 0.02; // shortest a word may be, in seconds
      const JOIN = 0.005; // a word that starts this close to the end of the one before shares an edge with it
      const PEAKS = 200; // waveform points per second
      const LANE = 34,
        RULER = 16; // heights of the timeline's row of blocks and of its time ruler
      const STEPS = {
        line: {
          button: "byLine",
          space: "line starts",
          enter: "line ends here",
          hint: "Press Space as each line starts. Its words are spread over the line by their length.",
        },
        word: {
          button: "byWord",
          space: "word starts",
          enter: "word ends here",
          hint: "Press Space as each word starts. Dotted lines still have estimated word times.",
        },
        review: {
          button: "review",
          space: "play / pause",
          hint: "Watch the fill as it will be in the video. Drag the edge of a word in the timeline to move it.",
        },
      };
      const $ = (id) => document.getElementById(id);
      const audio = new Audio();
      const canvas = $("timeline"),
        pen = canvas.getContext("2d");
      // A line: `start` is null until it is timed; `end` is where it is known to end (Enter, or a dragged
      // edge), null when that is worked out from its length; `byWord` says its word times were set by
      // hand instead of being spread by length.
      let lines = []; // [{start, end, byWord, words: [{text, start, end, cut}]}]
      let cursor = 0; // line the next tap times
      let wordCursor = 0; // word within it, in the words step
      let step = "line"; // 'line', 'word' or 'review'
      let undo = [];
      let dirty = false;
      let closeArmed = false;
      let closed = false;
      let duration = 0;
      let peaks = null; // loudness of the song, PEAKS values per second, for the waveform
      let view = { scale: 140, lead: 0.3 }; // timeline: pixels per second, and how far across the playhead sits
      let rows = []; // the lyric column's elements: [{row, words: [span]}]
      let marked = null; // row that carries the highlight
      let cache = null; // spans(), until something changes
      let drag = null; // a pointer held down on the timeline

      const clock = (t) =>
        `${String(Math.floor(t / 60)).padStart(2, "0")}:${(t % 60).toFixed(2).padStart(5, "0")}`;
      const weight = (text) => text.replace(/[^\p{L}\p{N}]/gu, "").length + 2;
      const sum = (values) => values.reduce((a, b) => a + b, 0);
      const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
      const say = (message) => {
        $("status").textContent = message;
      };
      const textOf = (line) => line.words.map((word) => word.text).join(" ");
      const lineEnd = (line) => line.words[line.words.length - 1].end;
      // A line with one word has nothing left to do in the words step once it is timed.
      const done = (line) =>
        line.start != null && (line.byWord || line.words.length === 1);
      const place = (time) =>
        view.lead * canvas.clientWidth +
        (time - audio.currentTime) * view.scale;
      const timeAt = (x) =>
        audio.currentTime + (x - view.lead * canvas.clientWidth) / view.scale;

      function nextStart(index) {
        for (let i = index + 1; i < lines.length; i++)
          if (lines[i].start != null) return lines[i].start;
        return null;
      }

      function previousTimed(index) {
        for (let i = index - 1; i >= 0; i--)
          if (lines[i].start != null) return i;
        return -1;
      }

      // How long words last when nothing says where they end: their estimated length, stretched or
      // squeezed towards the start of the next line.
      function autoLength(index, begin, guess) {
        return Math.max(
          0.5 * guess,
          Math.min(1.5 * guess, (nextStart(index) ?? Infinity) - begin),
        );
      }

      // Time the words of a line from word `from` on, by length, up to the line's end or the next line.
      function spread(index, from = 0) {
        const line = lines[index];
        if (line.start == null) return;
        const rest = line.words.slice(from);
        const begin = from === 0 ? line.start : rest[0].start;
        const weights = rest.map((word) => weight(word.text));
        const total = sum(weights);
        if (line.end != null && line.end - begin < MIN * rest.length)
          line.end = null; // the known end is already behind
        const length =
          line.end != null
            ? line.end - begin
            : autoLength(index, begin, SECONDS_PER_CHAR * total);
        let used = 0;
        rest.forEach((word, k) => {
          word.start = begin + (length * used) / total;
          used += weights[k];
          word.end = begin + (length * used) / total;
          word.cut = false;
        });
      }

      function shift(line, delta) {
        const move = (t) => (t == null ? t : Math.max(0, t + delta));
        line.start = move(line.start);
        line.end = move(line.end);
        for (const word of line.words) {
          word.start = move(word.start);
          word.end = move(word.end);
        }
      }

      // Taps rewind the song a little when they are undone; other changes leave it where it is.
      function remember(rewind = false) {
        undo.push({
          state: JSON.stringify({ lines, cursor, wordCursor }),
          time: rewind ? audio.currentTime : null,
        });
        if (undo.length > 1000) undo.shift();
        dirty = true;
        closeArmed = false;
        $("save").classList.add("unsaved");
        say("");
      }

      // Line `index` has a new start: the timed line before it cannot run past that.
      function settleBefore(index) {
        const at = previousTimed(index);
        if (at < 0) return;
        const before = lines[at],
          t = lines[index].start;
        if (!before.byWord) {
          if (before.end != null && before.end > t) before.end = t;
          return spread(at);
        }
        const last = before.words[before.words.length - 1];
        if (last.end > t) {
          last.end = Math.max(last.start + MIN, t);
          if (before.end != null) before.end = last.end;
        }
      }

      function tap() {
        if (step === "review") return toggle();
        if (cursor >= lines.length)
          return say("Every line is timed. Click a line to time it again.");
        const t = audio.currentTime,
          line = lines[cursor],
          words = line.words;
        const floor =
          step === "word" && wordCursor > 0
            ? words[wordCursor - 1].start
            : lines[previousTimed(cursor)]?.start;
        if (floor != null && t <= floor)
          return say(
            "Not timed: this is earlier than the timing before it. Click the line you want to time again.",
          );
        remember(true);
        if (step === "line") {
          if (line.byWord && line.start != null) {
            shift(line, t - line.start); // words tapped by hand keep their rhythm
          } else {
            Object.assign(line, { start: t, end: null, byWord: false });
            spread(cursor);
          }
          settleBefore(cursor);
          cursor++;
        } else {
          line.byWord = true;
          if (wordCursor === 0) {
            line.start = t;
            settleBefore(cursor);
          } else {
            const before = words[wordCursor - 1];
            before.end = before.cut ? Math.min(before.end, t) : t;
          }
          words[wordCursor].start = t;
          spread(cursor, wordCursor); // the words still to tap get a provisional time
          if (++wordCursor >= words.length) {
            cursor++;
            wordCursor = 0;
          }
        }
        draw();
      }

      // End the last tapped line or word at the current time instead of at the next tap.
      function cut() {
        if (step === "review") return;
        const mid = step === "word" && wordCursor > 0;
        const index = mid ? cursor : cursor - 1;
        const line = lines[index];
        if (!line || line.start == null) return;
        const words = line.words,
          word = mid ? words[wordCursor - 1] : words[words.length - 1];
        const single = mid || line.byWord; // one word ends here, not a whole estimated line
        const t = Math.min(
          audio.currentTime,
          mid ? Infinity : (nextStart(index) ?? Infinity),
        );
        if (t < (single ? word.start : line.start) + MIN) return;
        remember();
        if (!single) {
          line.end = t;
          spread(index);
        } else {
          line.byWord = true;
          Object.assign(word, { end: t, cut: true });
          if (mid) {
            words[wordCursor].start = t;
            spread(cursor, wordCursor);
          } else {
            line.end = t;
          }
        }
        draw();
      }

      function undoLast() {
        const last = undo.pop();
        if (!last) return say("Nothing to undo.");
        ({ lines, cursor, wordCursor } = JSON.parse(last.state));
        if (last.time != null) audio.currentTime = Math.max(0, last.time - 1.5);
        draw();
      }

      // Make a line, or in the words step one of its words, the next thing to tap.
      function select(index, k = 0) {
        const line = lines[index];
        if (step === "review") {
          if (line.start != null)
            audio.currentTime = Math.max(0, line.start - 0.5);
          return;
        }
        cursor = index;
        wordCursor = step === "word" && line.words[k].start != null ? k : 0;
        const at = wordCursor ? line.words[wordCursor].start : line.start;
        if (at != null) audio.currentTime = Math.max(0, at - 2);
        draw();
      }

      // Up and down: to the start of the line being tapped, then the line before, or the line after.
      function move(delta) {
        if (!lines.length) return;
        if (step === "review") {
          const t = audio.currentTime,
            timed = lines.filter((line) => line.start != null);
          const line =
            delta > 0
              ? timed.find((line) => line.start > t + 0.6)
              : timed.findLast((line) => line.start < t - 0.6);
          if (line) audio.currentTime = Math.max(0, line.start - 0.5);
          return;
        }
        if (delta < 0 && wordCursor > 0) return select(cursor);
        select(clamp(cursor + delta, 0, lines.length - 1));
      }

      function shiftAll(delta) {
        remember();
        for (const line of lines) shift(line, delta);
        draw();
      }

      function clearFromHere() {
        if (cursor >= lines.length) return;
        remember();
        for (const line of lines.slice(cursor)) {
          Object.assign(line, { start: null, end: null, byWord: false });
          for (const word of line.words)
            Object.assign(word, { start: null, end: null, cut: false });
        }
        wordCursor = 0;
        draw();
      }

      // Where the current step has work left: the first line it has not dealt with.
      function todo() {
        const index = lines.findIndex((line) =>
          step === "word" ? !done(line) : line.start == null,
        );
        return index < 0 ? lines.length : index;
      }

      function setStep(next) {
        step = next;
        cursor = todo();
        wordCursor = 0;
        document.body.dataset.step = step;
        for (const [name, { button }] of Object.entries(STEPS))
          $(button).classList.toggle("on", name === step);
        $("hint").textContent = STEPS[step].hint;
        const { space, enter } = STEPS[step];
        const keys = [
          ["Space", space],
          ...(enter ? [["Enter", enter]] : []),
          ["Backspace", "undo"],
          ["P", "play / pause"],
          ["← →", "3 s"],
          ["↑ ↓", "line"],
          ["1 2 3", "speed"],
        ];
        $("keys").replaceChildren(
          ...keys.map(([names, what]) => {
            const item = document.createElement("span");
            for (const name of names.split(" ")) {
              const key = document.createElement("kbd");
              key.textContent = name;
              item.append(key, " ");
            }
            item.append(what);
            return item;
          }),
        );
        const line = lines[cursor];
        if (step !== "review" && line?.start != null)
          audio.currentTime = Math.max(0, line.start - 2);
        draw();
      }

      function openEditor() {
        $("text").value = lines.map(textOf).join("\n");
        document.body.classList.add("editing");
        audio.pause();
        $("text").focus();
      }

      // A row whose text changed. Words tapped by hand keep their times if there are still as many;
      // otherwise the line keeps its place in the song and its words are estimated again.
      function reword(old, text) {
        const texts = text.split(" ");
        if (old?.byWord && old.words.length === texts.length) {
          return {
            ...old,
            words: old.words.map((word, k) => ({ ...word, text: texts[k] })),
          };
        }
        const words = texts.map((word) => ({
          text: word,
          start: null,
          end: null,
          cut: false,
        }));
        return {
          start: old?.start ?? null,
          end: old?.start != null ? lineEnd(old) : null,
          byWord: false,
          words,
        };
      }

      function applyLyrics() {
        const texts = $("text")
          .value.split("\n")
          .map((row) => row.trim().replace(/\s+/g, " "))
          .filter(Boolean);
        const old = lines,
          was = old.map(textOf),
          n = was.length,
          m = texts.length;
        remember();
        // The longest run of rows that are still there, in order, keeps its timing untouched.
        const common = Array.from(
          { length: n + 1 },
          () => new Uint16Array(m + 1),
        );
        for (let i = n - 1; i >= 0; i--) {
          for (let j = m - 1; j >= 0; j--) {
            common[i][j] =
              was[i] === texts[j]
                ? common[i + 1][j + 1] + 1
                : Math.max(common[i + 1][j], common[i][j + 1]);
          }
        }
        const kept = [];
        for (let i = 0, j = 0; i < n && j < m; ) {
          if (was[i] === texts[j]) kept.push([i++, j++]);
          else if (common[i + 1][j] >= common[i][j + 1]) i++;
          else j++;
        }
        kept.push([n, m]);
        lines = [];
        let i = 0,
          j = 0;
        for (const [keptOld, keptNew] of kept) {
          // Between two kept rows, as many rows as before means they were reworded, not added or removed.
          const reworded = keptOld - i === keptNew - j;
          for (; j < keptNew; i++, j++)
            lines.push(reword(reworded ? old[i] : null, texts[j]));
          if (keptOld < n) lines.push(old[keptOld]);
          i = keptOld + 1;
          j = keptNew + 1;
        }
        lines.forEach((line, index) => {
          if (line.start != null && line.words[0].start == null) spread(index);
        });
        cursor = todo();
        wordCursor = 0;
        document.body.classList.remove("editing");
        draw();
      }

      // Rebuild the lyric column. Cheap enough to do after every change.
      function draw() {
        cache = null;
        marked = null;
        rows = lines.map((line, index) => {
          const row = document.createElement("div");
          row.className =
            "line " +
            (line.start == null ? "untimed" : done(line) ? "tapped" : "guess");
          row.onclick = () => select(index);
          const stamp = document.createElement("span");
          stamp.className = "stamp";
          stamp.textContent =
            line.start == null ? "--:--.--" : clock(line.start);
          const text = document.createElement("span");
          text.className = "words";
          const words = line.words.map((word, k) => {
            const span = document.createElement("span");
            span.className =
              "word" +
              (step === "word" && index === cursor && k === wordCursor
                ? " next"
                : "");
            span.textContent = word.text;
            span.onclick = (event) => {
              event.stopPropagation();
              select(index, k);
            };
            text.append(span, " ");
            return span;
          });
          row.append(stamp, text);
          return { row, words };
        });
        $("lines").replaceChildren(...rows.map((entry) => entry.row));
        $("lineCount").textContent =
          `${lines.filter((line) => line.start != null).length}/${lines.length}`;
        $("wordCount").textContent =
          `${lines.filter(done).length}/${lines.length}`;
        paint();
      }

      function lineAt(t) {
        let found = -1;
        lines.forEach((line, index) => {
          if (line.start != null && line.start <= t) found = index;
        });
        return found;
      }

      // Show the fill as the renderer will: words turn gold as the playhead passes them. The marked
      // row is the one to tap next, or in the review step the one being sung.
      function paint() {
        if (closed) return;
        const t = audio.currentTime;
        $("clock").textContent = `${clock(t)} / ${clock(duration)}`;
        if (document.activeElement !== $("seek")) $("seek").value = t;
        const want =
          step === "review"
            ? lineAt(t + 0.3)
            : cursor < lines.length
              ? cursor
              : -1;
        if (want !== marked) {
          rows[marked]?.row.classList.remove("target");
          rows[want]?.row.classList.add("target");
          (
            rows[want] ?? rows[step === "review" ? 0 : rows.length - 1]
          )?.row.scrollIntoView({ block: "center" });
          marked = want;
        }
        lines.forEach((line, index) =>
          line.words.forEach((word, k) => {
            const span = rows[index]?.words[k],
              timed = word.start != null;
            if (!span) return;
            const active = timed && t >= word.start && t < word.end;
            span.classList.toggle("sung", timed && t >= word.end);
            span.classList.toggle("active", active);
            if (active)
              span.style.setProperty(
                "--fill",
                `${(100 * (t - word.start)) / (word.end - word.start)}%`,
              );
          }),
        );
        sketch();
      }

      function refresh() {
        cache = null;
        paint();
      }

      // What the timeline shows and lets you drag: whole lines in the lines step, single words after
      // it. `minEnd` and `maxStart` are how far the edges may be pushed together. The outer edges of
      // an estimated line stretch the whole estimate, so there they leave room for all of its words.
      function spans() {
        if (cache) return cache;
        cache = [];
        lines.forEach((line, index) => {
          if (line.start == null) return;
          const words = line.words,
            last = words.length - 1,
            room = 2 * MIN * words.length,
            soft = !done(line);
          if (step === "line") {
            cache.push({
              index,
              k: null,
              start: line.start,
              end: words[last].end,
              text: textOf(line),
              soft,
              minEnd: line.byWord ? words[last].start + MIN : line.start + room,
              maxStart: line.byWord
                ? words[0].end - MIN
                : words[last].end - room,
            });
          } else {
            words.forEach((word, k) =>
              cache.push({
                index,
                k,
                start: word.start,
                end: word.end,
                text: word.text,
                soft,
                minEnd:
                  !line.byWord && k === last
                    ? line.start + room
                    : word.start + MIN,
                maxStart:
                  !line.byWord && k === 0
                    ? words[last].end - room
                    : word.end - MIN,
              }),
            );
          }
        });
        return cache;
      }

      // Draw the timeline: the song's waveform scrolling under a fixed playhead, with the timed lines
      // or words as blocks along the top.
      function sketch() {
        const width = canvas.clientWidth,
          height = canvas.clientHeight,
          ratio = devicePixelRatio || 1;
        if (!width) return;
        if (
          canvas.width !== Math.round(width * ratio) ||
          canvas.height !== Math.round(height * ratio)
        ) {
          canvas.width = Math.round(width * ratio);
          canvas.height = Math.round(height * ratio);
        }
        pen.setTransform(ratio, 0, 0, ratio, 0, 0);
        pen.clearRect(0, 0, width, height);
        const t = audio.currentTime,
          head = view.lead * width;
        const x = (time) => head + (time - t) * view.scale;
        const from = t - head / view.scale,
          to = from + width / view.scale;
        const bottom = height - RULER,
          middle = (LANE + bottom) / 2,
          reach = (bottom - LANE) / 2 - 3;

        if (peaks) {
          // At low zoom several points share a pixel; they are merged on a fixed grid so the wave does not shimmer.
          const stride = Math.max(1, Math.floor(PEAKS / view.scale));
          const first = Math.max(
              0,
              Math.floor((from * PEAKS) / stride) * stride,
            ),
            last = Math.min(peaks.length - 1, Math.ceil(to * PEAKS));
          const outline = [];
          for (let i = first; i <= last; i += stride) {
            let level = 0;
            for (let j = i; j < i + stride && j < peaks.length; j++)
              level = Math.max(level, peaks[j]);
            outline.push([x(i / PEAKS), Math.max(0.5, level * reach)]);
          }
          pen.beginPath();
          for (const [at, size] of outline) pen.lineTo(at, middle - size);
          for (const [at, size] of outline.reverse())
            pen.lineTo(at, middle + size);
          pen.fillStyle = "#3b3b54";
          pen.fill();
        }

        const every =
          [1, 2, 5, 10, 15, 30].find((seconds) => seconds * view.scale >= 70) ??
          60;
        pen.fillStyle = "#8a8a96";
        pen.font = '11px "Segoe UI", system-ui, sans-serif';
        pen.textBaseline = "middle";
        for (
          let second = Math.max(0, Math.ceil(from));
          second <= Math.min(to, duration);
          second++
        ) {
          pen.fillRect(x(second), bottom, 1, second % every ? 3 : 6);
          if (second % every === 0)
            pen.fillText(clock(second).slice(0, 5), x(second) + 4, bottom + 9);
        }

        const list = spans();
        pen.font = '600 13px "Segoe UI", system-ui, sans-serif';
        list.forEach((span, at) => {
          if (span.end < from || span.start > to) return;
          const left = x(span.start),
            wide = Math.max(1, x(span.end) - left);
          const mine = span.index === marked,
            next =
              step === "word" && span.index === cursor && span.k === wordCursor;
          // Each edge runs down through the waveform, to line it up with what is heard there.
          pen.fillStyle = mine
            ? "rgba(255, 215, 0, 0.5)"
            : "rgba(255, 255, 255, 0.16)";
          pen.fillRect(left, LANE, 1, bottom - LANE);
          if (!list[at + 1] || Math.abs(list[at + 1].start - span.end) > JOIN)
            pen.fillRect(left + wide, LANE, 1, bottom - LANE);
          pen.fillStyle = next
            ? "rgba(255, 215, 0, 0.3)"
            : span.soft
              ? "rgba(255, 255, 255, 0.05)"
              : "rgba(255, 255, 255, 0.13)";
          pen.strokeStyle = mine
            ? "#ffd700"
            : span.soft
              ? "#6a6a7c"
              : "#b4b4c2";
          pen.setLineDash(span.soft ? [4, 3] : []);
          pen.beginPath();
          pen.roundRect(left + 0.5, 4.5, wide - 1, LANE - 9, 4);
          pen.fill();
          pen.stroke();
          if (left < head) {
            pen.fillStyle = "rgba(255, 215, 0, 0.28)";
            pen.fillRect(
              left + 1,
              5,
              Math.max(0, Math.min(wide, head - left) - 1.5),
              LANE - 10,
            );
          }
          if (wide > 16) {
            pen.save();
            pen.beginPath();
            pen.rect(left + 4, 0, wide - 8, LANE);
            pen.clip();
            pen.fillStyle = span.soft ? "#b4b4c2" : "#fff";
            pen.fillText(span.text, Math.max(left, 0) + 6, LANE / 2);
            pen.restore();
          }
        });
        pen.setLineDash([]);

        pen.fillStyle = "rgba(0, 0, 0, 0.45)"; // outside the song
        if (from < 0) pen.fillRect(0, 0, x(0), height);
        if (to > duration)
          pen.fillRect(x(duration), 0, width - x(duration), height);
        pen.fillStyle = "#ffd700";
        pen.fillRect(head - 1, 0, 2, height);
      }

      // The draggable edge under the pointer, if any. Words that touch share one edge, held at the
      // start of the later one; where an end and a start sit in the same spot without touching, the
      // side the pointer is on tells them apart.
      function edgeAt(x, y) {
        if (y > LANE) return null;
        const list = spans();
        let best = null;
        list.forEach((span, at) => {
          const before = list[at - 1],
            after = list[at + 1];
          const edges = [
            {
              at,
              edge: "start",
              time: span.start,
              joint:
                before != null && Math.abs(span.start - before.end) <= JOIN,
            },
          ];
          if (!after || Math.abs(after.start - span.end) > JOIN)
            edges.push({ at, edge: "end", time: span.end, joint: false });
          for (const edge of edges) {
            const off = x - place(edge.time);
            const distance =
              Math.abs(off) +
              ((edge.edge === "start" ? off < 0 : off > 0) ? 0.5 : 0);
            if (Math.abs(off) <= 6 && (!best || distance < best.distance))
              best = { ...edge, distance };
          }
        });
        return best;
      }

      function spanAt(x, y) {
        return y > LANE
          ? -1
          : spans().findIndex(
              (span) => place(span.start) <= x && x <= place(span.end),
            );
      }

      // The outer edge of an estimated line stretches the estimate; any other edge pins a word by hand.
      function setStart({ index, k }, t) {
        const line = lines[index];
        if (!line.byWord && !k) {
          line.end = lineEnd(line);
          line.start = t;
          return spread(index);
        }
        line.byWord = true;
        line.words[k ?? 0].start = t;
        if (!k) line.start = t;
      }

      function setEnd({ index, k }, t) {
        const line = lines[index],
          last = line.words.length - 1;
        if (!line.byWord && (k ?? last) === last) {
          line.end = t;
          return spread(index);
        }
        line.byWord = true;
        Object.assign(line.words[k ?? last], { end: t, cut: true });
        if ((k ?? last) === last) line.end = t;
      }

      function moveEdge({ at, edge, joint }, t) {
        const list = spans(),
          span = list[at],
          before = list[at - 1],
          after = list[at + 1];
        if (edge === "start") {
          t = clamp(
            t,
            Math.min(
              span.start,
              joint ? before.minEnd : before ? before.end : 0,
            ),
            span.maxStart,
          );
          setStart(span, t);
          if (joint) setEnd(before, t);
        } else {
          t = clamp(
            t,
            span.minEnd,
            Math.max(span.end, after ? after.start : duration),
          );
          setEnd(span, t);
        }
        say(clock(t));
      }

      // Slide a whole line along the song, between the lines around it.
      function moveLine(at, start) {
        const list = spans(),
          span = list[at],
          before = list[at - 1],
          after = list[at + 1];
        const low = Math.min(span.start, before ? before.end : 0);
        const high = Math.max(
          span.start,
          (after ? after.start : duration) - (span.end - span.start),
        );
        const line = lines[span.index];
        line.end = span.end;
        shift(line, clamp(start, low, high) - span.start);
        say(clock(line.start));
      }

      const spot = (event) => {
        const box = canvas.getBoundingClientRect();
        return [event.clientX - box.left, event.clientY - box.top];
      };

      canvas.onpointerdown = (event) => {
        const [x, y] = spot(event);
        const edge = edgeAt(x, y),
          at = edge ? -1 : spanAt(x, y);
        if (edge && event.shiftKey) edge.joint = false;
        drag = {
          x,
          edge,
          at,
          moved: false,
          from: audio.currentTime,
          playing: !audio.paused,
          line: at >= 0 && step === "line",
          grab: at >= 0 ? timeAt(x) - spans()[at].start : 0,
        };
        canvas.setPointerCapture(event.pointerId);
      };

      canvas.onpointermove = (event) => {
        const [x, y] = spot(event);
        if (!drag) {
          canvas.style.cursor = edgeAt(x, y)
            ? "ew-resize"
            : spanAt(x, y) < 0
              ? "default"
              : step === "line"
                ? "grab"
                : "pointer";
          return;
        }
        if (!drag.moved && Math.abs(x - drag.x) < 3) return;
        if (!drag.moved) {
          drag.moved = true;
          audio.pause();
          if (drag.edge || drag.line) remember();
        }
        if (drag.edge) moveEdge(drag.edge, timeAt(x));
        else if (drag.line) moveLine(drag.at, timeAt(x) - drag.grab);
        else
          audio.currentTime = clamp(
            drag.from - (x - drag.x) / view.scale,
            0,
            duration,
          ); // the wave follows the pointer
        refresh();
      };

      canvas.onpointerup = (event) => {
        if (!drag) return;
        const { moved, edge, at, line, playing } = drag;
        drag = null;
        if (!moved)
          audio.currentTime = clamp(
            at >= 0 ? spans()[at].start : timeAt(spot(event)[0]),
            0,
            duration,
          );
        else if (edge || line) draw();
        else if (playing) audio.play();
      };

      canvas.onpointercancel = () => {
        if (drag?.moved) draw();
        drag = null;
      };

      canvas.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();
          view.scale = clamp(
            view.scale * (event.deltaY < 0 ? 1.25 : 0.8),
            40,
            800,
          );
          sketch();
        },
        { passive: false },
      );

      new ResizeObserver(sketch).observe(canvas);

      function frame() {
        if (!audio.paused) paint();
        requestAnimationFrame(frame);
      }

      async function save() {
        const round = (t) => (t == null ? null : Math.round(t * 1000) / 1000);
        const rows = lines.map((line) => ({
          start: round(line.start),
          end: round(line.end),
          words: line.words.map((word) => ({
            text: word.text,
            start: round(word.start),
            end: round(word.end),
          })),
        }));
        const response = await fetch(base + "save", {
          method: "POST",
          body: JSON.stringify(rows),
        });
        const untimed = lines.filter((line) => line.start == null).length;
        say(
          (await response.text()) +
            (response.ok && untimed ? `; ${untimed} lines still untimed` : ""),
        );
        if (response.ok) {
          dirty = false;
          $("save").classList.remove("unsaved");
        }
      }

      async function closeEditor() {
        if (dirty && !closeArmed) {
          closeArmed = true;
          return say(
            "Unsaved changes. Press Close again to discard them, or Save first.",
          );
        }
        await fetch(base + "close", { method: "POST" });
        audio.pause();
        closed = true;
        dirty = false;
        document.body.innerHTML =
          '<p style="margin:auto;font-size:20px">Editor closed. Go back to the terminal.</p>';
      }

      function toggle() {
        audio.paused ? audio.play() : audio.pause();
      }

      $("play").onclick = toggle;
      audio.onplay = audio.onpause = () => {
        $("play").textContent = audio.paused ? "Play" : "Pause";
        paint();
      };
      audio.onseeked = paint;
      $("seek").oninput = (event) => {
        audio.currentTime = Number(event.target.value);
      };
      $("speed").onchange = (event) => {
        audio.playbackRate = Number(event.target.value);
        event.target.blur();
      };
      $("byLine").onclick = () => setStep("line");
      $("byWord").onclick = () => setStep("word");
      $("review").onclick = () => setStep("review");
      $("earlier").onclick = () => shiftAll(-0.05);
      $("later").onclick = () => shiftAll(0.05);
      $("clear").onclick = clearFromHere;
      $("edit").onclick = openEditor;
      $("apply").onclick = applyLyrics;
      $("cancel").onclick = () => document.body.classList.remove("editing");
      $("save").onclick = save;
      $("close").onclick = closeEditor;
      addEventListener("beforeunload", (event) => {
        if (dirty) event.preventDefault();
      });

      document.addEventListener("keydown", (event) => {
        if (closed) return;
        const key =
          event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (document.body.classList.contains("editing")) {
          if (key === "Escape") $("cancel").click();
          return;
        }
        if (event.ctrlKey && key === "s") {
          event.preventDefault();
          return save();
        }
        if (event.ctrlKey && key === "z") {
          event.preventDefault();
          return undoLast();
        }
        if (event.ctrlKey || event.altKey || event.metaKey) return;
        const keys = {
          // A tap while the song stands still would time nothing useful, so there Space starts it.
          " ": () => (audio.paused ? audio.play() : tap()),
          Enter: cut,
          Backspace: undoLast,
          p: toggle,
          ArrowLeft: () => {
            audio.currentTime = Math.max(0, audio.currentTime - 3);
          },
          ArrowRight: () => {
            audio.currentTime = audio.currentTime + 3;
          },
          ArrowUp: () => move(-1),
          ArrowDown: () => move(1),
          1: () => setSpeed("0.5"),
          2: () => setSpeed("0.75"),
          3: () => setSpeed("1"),
        };
        const action = keys[key];
        if (!action) return;
        event.preventDefault();
        if (event.repeat && (key === " " || key === "Enter")) return; // a held key is one tap
        if (event.target.matches("button, select, input")) event.target.blur();
        action();
      });

      function setSpeed(value) {
        $("speed").value = value;
        audio.playbackRate = Number(value);
      }

      // A loaded line whose word times are an even spread by length was estimated, not tapped.
      function recognise(index) {
        const line = lines[index],
          words = line.words,
          begin = line.start,
          length = lineEnd(line) - begin;
        const weights = words.map((word) => weight(word.text)),
          total = sum(weights);
        let used = 0;
        const even = words.every((word, k) => {
          const from = begin + (length * used) / total;
          used += weights[k];
          return (
            Math.abs(word.start - from) < 0.0125 &&
            Math.abs(word.end - (begin + (length * used) / total)) < 0.0125
          );
        });
        line.byWord = !even;
        words.forEach((word, k) => {
          word.cut =
            k + 1 < words.length && words[k + 1].start - word.end > JOIN;
        });
        // An end that is not where the estimate would put it was set on purpose.
        if (
          !even ||
          Math.abs(
            length - autoLength(index, begin, SECONDS_PER_CHAR * total),
          ) > 0.02
        )
          line.end = begin + length;
      }

      // Loudness of the song over time, read from the WAV the server sends (16-bit PCM). It is the
      // average level and not the peak: a loud master peaks at full scale nearly all the time, which
      // would draw as a solid bar.
      function loudness(buffer) {
        const data = new DataView(buffer);
        let channels = 2,
          rate = 44100;
        for (let at = 12; at + 8 <= data.byteLength; ) {
          const name = String.fromCharCode(
            data.getUint8(at),
            data.getUint8(at + 1),
            data.getUint8(at + 2),
            data.getUint8(at + 3),
          );
          const size = data.getUint32(at + 4, true);
          if (name === "fmt ") {
            channels = data.getUint16(at + 10, true);
            rate = data.getUint32(at + 12, true);
          }
          if (name === "data") {
            const samples = new Int16Array(
              buffer,
              at + 8,
              Math.min(size, data.byteLength - at - 8) >> 1,
            );
            const per = (rate * channels) / PEAKS;
            const levels = new Float64Array(Math.ceil(samples.length / per));
            for (let i = 0; i < samples.length; i++)
              levels[Math.floor(i / per)] += samples[i] * samples[i];
            const top = Math.sqrt(levels.reduce((a, b) => Math.max(a, b), 1));
            return levels.map((level) => Math.sqrt(level) / top);
          }
          at += 8 + size + (size & 1);
        }
        return null;
      }

      (async () => {
        const state = await (await fetch(base + "state")).json();
        $("title").textContent = state.title;
        document.title = `${state.title}: lyrics sync`;
        duration = state.duration;
        $("seek").max = duration;
        const song = await (await fetch(base + "audio")).blob();
        audio.src = URL.createObjectURL(song);
        lines = state.lines.map((line) => ({
          start: line.start,
          end: null,
          byWord: false,
          words: line.words.map((word) => ({ ...word, cut: false })),
        }));
        lines.forEach((line, index) => {
          if (line.start == null) return;
          // A line that has a start but no word times (line-level lyrics) gets its words spread by length.
          if (line.words.some((word) => word.start == null)) spread(index);
          else recognise(index);
        });
        const untimed = lines.filter((line) => line.start == null).length,
          guessed = lines.filter((line) => !done(line)).length - untimed;
        setStep(
          untimed || !lines.length ? "line" : guessed ? "word" : "review",
        );
        if (!lines.length) openEditor();
        say(
          !lines.length
            ? "Add the lyrics to begin"
            : untimed
              ? `${untimed} of ${lines.length} lines untimed`
              : guessed
                ? `${guessed} of ${lines.length} lines have estimated word times`
                : "Every line is timed",
        );
        frame();
        try {
          peaks = loudness(await song.arrayBuffer());
        } catch (problem) {
          console.warn("no waveform:", problem);
        }
        sketch();
      })();
    </script>
  </body>
</html>
